name: Publish development preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/preview.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: preview-pages
  cancel-in-progress: true
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.artifact_name.outputs.name }}
    steps:
      - name: Check out Speaking Lab development branch
        uses: actions/checkout@v4
        with:
          repository: stevenbennett-hub/speaking-lab
          ref: dev
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test development build
        run: node --test tests/*.test.mjs
      - name: Mark preview build
        run: |
          echo '{ "channel": "preview" }' > site/data/preview.json
      - name: Choose unique artifact name
        id: artifact_name
        run: echo "name=github-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Upload preview
        uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ steps.artifact_name.outputs.name }}
          path: site
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Allow artifact metadata to propagate
        run: sleep 15
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
